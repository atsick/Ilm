<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  -webkit-text-size-adjust: 100%;

  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
body { position: fixed; top: 0; left: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

/* The page is drawn on a fixed stage (1024x768 or 768x1024) and scaled to fit the screen. */
#stage {
  position: absolute; left: 0; top: 0;
  -webkit-transform-origin: 0 0; transform-origin: 0 0;
  -webkit-transition: opacity 1.5s; transition: opacity 1.5s;
}
#stage.land { width: 1024px; height: 768px; }
#stage.port { width: 768px; height: 1024px; }
#stage > div { position: absolute; }

#clock { font-size: 104px; font-weight: 200; line-height: 104px; height: 104px; letter-spacing: -1px; }
#date { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 23px; line-height: 24px; height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#nowbox { display: flex; align-items: center; }
#temp { font-size: 104px; font-weight: 200; line-height: 1; letter-spacing: -2px; white-space: nowrap; flex: none; }
#condbox { margin-left: 14px; min-width: 0; flex: 1 1 auto; overflow: hidden; }
#icon { height: 64px; }
#cond { font-size: 21px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feels { font-size: 18px; margin-top: 2px; white-space: nowrap; }

#stats { display: flex; flex-wrap: wrap; }
.tile { padding: 6px; }
.box { height: 100%; border-radius: 12px; padding: 9px 14px; overflow: hidden; }
.tl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap; }
.tv { font-size: 32px; font-weight: 300; margin-top: 3px; white-space: nowrap; }
.tv .u { font-size: 16px; font-weight: 400; }
.ts { font-size: 15px; margin-top: 2px; white-space: nowrap; }

.panel { border-radius: 14px; }
#alerts { padding: 6px 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.chip { display: flex; align-items: center; height: 28px; margin-bottom: 4px; border-radius: 8px; padding: 0 10px 0 8px; font-size: 16px; white-space: nowrap; overflow: hidden; }
.chip:last-child { margin-bottom: 0; }
.chip svg { flex: none; margin-right: 9px; }
.chip .ct { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.chip .cg { flex: none; margin-left: 10px; font-size: 14px; }
#alerts .calm { display: flex; align-items: center; height: 100%; font-size: 19px; }
#alerts .calm svg { margin-right: 12px; flex: none; }

#chartpanel { padding: 10px 14px 8px; overflow: hidden; }
.ptitle { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#chart { display: block; }
#chart svg { display: block; }

#sun { display: flex; justify-content: space-between; align-items: center; padding: 0 18px; }
.sv { font-size: 31px; font-weight: 300; margin-top: 1px; white-space: nowrap; }
.sv .u { font-size: 15px; font-weight: 400; }

#days { display: flex; }
.day { flex: 1 1 0; margin-left: 10px; border-radius: 14px; text-align: center; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.day:first-child { margin-left: 0; }
.dn { font-size: 19px; text-transform: uppercase; letter-spacing: 1px; }
.dhi { font-size: 30px; font-weight: 300; }
.dlo { font-size: 22px; margin-left: 8px; }
.dp { font-size: 15px; }

#status { display: flex; justify-content: space-between; font-size: 13px; white-space: nowrap; overflow: hidden; }

/* sports panel: only shown while there is something to show; the layouts below with ".sp" make room for it */
#sports { display: none; padding: 6px 14px; overflow: hidden; }
.sp #sports { display: block; }
.sh { display: flex; justify-content: space-between; align-items: baseline; height: 22px; white-space: nowrap; overflow: hidden; }
.spt { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
.spz { font-size: 12px; }
.scols { display: flex; }
.scol { flex: 1 1 0; min-width: 0; }
.scol + .scol { margin-left: 12px; padding-left: 12px; }
.tr { display: flex; align-items: center; height: 22px; }

.dot { display: block; width: 9px; height: 9px; border-radius: 50%; }
.dot.d3 { height: 2px; border-radius: 0; }
.tg { flex: none; width: 50px; margin-right: 10px; text-align: center; font-size: 11px; font-weight: bold; letter-spacing: 0.4px; border-radius: 5px; padding: 1px 0; white-space: nowrap; }

.tm .ti { flex: none; width: 22px; height: 22px; margin: 1px 12px 0 0; }
.tm .tb { flex: 1 1 auto; min-width: 0; }
.tml { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap; }
.tmm { font-size: 19px; line-height: 24px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tmw { font-size: 15px; margin-top: 3px; white-space: nowrap; }
.tm .pill { display: inline-block; margin-left: 0; padding: 2px 10px; font-size: 12px; }

.sp .day { margin-left: 8px; padding: 3px 2px; justify-content: center; }
.sp .day:first-child { margin-left: 0; }
.sp .dn { font-size: 13px; line-height: 16px; }
.sp .dr { display: flex; align-items: center; justify-content: center; }
.sp .dt2 { display: flex; flex-direction: column; align-items: flex-start; margin-left: 6px; line-height: 1.05; }
.sp .dhi { font-size: 20px; }
.sp .dlo { font-size: 14px; margin-left: 0; }
.sp .dp { font-size: 12px; line-height: 14px; }

.land #clockbox { left: 22px; top: 12px; width: 400px; height: 128px; }

.land #status { left: 22px; top: 726px; width: 980px; height: 22px; }

.land.sp #sun { top: 454px; height: 58px; }

.port #clockbox { left: 22px; top: 14px; width: 724px; height: 128px; }

.port.sp #sports { left: 22px; top: 858px; width: 724px; height: 136px; }

  if (errMsg) {
    upd.innerHTML = '<span class="bad"></span>';
    upd.firstChild.textContent = errMsg + (lastDataTime ? ' · ' + L.updated + ' ' + lastDataTime : '');
  } else if (stale) {
    upd.innerHTML = '<span class="bad"></span>';
    upd.firstChild.textContent = L.noUpdate + ' ' + lastDataTime;
  } else {
    upd.textContent = lastDataTime ? L.updated + ' ' + lastDataTime + ' · Open-Meteo' : '';
  }
}
window.onerror = function (msg, src, line) {
  /* a bare "Script error." without a line number comes from outside this page
     (a browser extension or content blocker) - it says nothing about this page, so ignore it */
  if (String(msg) === 'Script error.' && !line) { return false; }
  errMsg = L.errWord + ': ' + msg + (line ? ' (' + line + ')' : '');
  refreshStatus();
  return false;
};

/* ============ sports (read from sports.json, which a second GitHub job keeps up to date) ============ */
/* Nothing is shown unless there is something to show: your three teams (only a game that is on or within 30 days),
   and the games on today, picked by priority. When the panel is empty the page keeps its plain layout. */
var SPORTS = null;
var spOn = false;
var SP_HORIZON_MS = 30 * 86400000;
var SP_TEAMS = [['lfc', 'ball'], ['eefb', 'ball'], ['eebb', 'basket']];

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function spDayKey(ms) { var d = new Date(ms); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function spHm(ms) { var d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function spDate(ms) {
  var d = new Date(ms);
  return LANG === 'et' ? L.wd[d.getDay()] + ' ' + d.getDate() + '. ' + L.sp.mon[d.getMonth()] : L.wd[d.getDay()] + ' ' + d.getDate() + ' ' + L.sp.mon[d.getMonth()];
}
function spState(g, now) {
  if (g.allday) { return 'live'; }
  if (g.st === 'post') { return 'done'; }
  var s = g.t * 1000, e = s + g.d * 60000;
  if (now < s) { return g.st === 'in' ? 'live' : 'pre'; }
  return now < e ? 'live' : 'done';
}
/* What to say about a game that is on right now: the minute, the quarter, the lap. Uses the clock the job saved when it is
   fresh, otherwise a guess from the start time (marked with ~). '' means there is nothing more to say than "live". */
function spMin(m, x) { return (x > 0 ? m + '+' + x : m) + "'"; }
function spLiveTxt(g, now) {
  var lv = g.lv, el, m, x, q, cap, am, ok, avg, lap;
  if (g.allday) { return ''; }
  if (g.c === 'NBA') {
    if (lv && lv.at && now - lv.at * 1000 < 20 * 60000) {
      if (lv.ph === 'ht') { return L.sp.ht; }
      if (lv.q > 4) { return L.sp.ot; }
      if (lv.q > 0) { return L.sp.qn(lv.q); }
    }
    return '';
  }
  if (g.c === 'F1') {
    if (lv && lv.lap && g.k === 'race' && now - lv.at * 1000 < 15 * 60000) {
      avg = lv.lap >= 5 ? Math.max(60, Math.min(180, (lv.at - g.t - 150) / lv.lap)) : 95;
      lap = lv.lap + Math.floor((now / 1000 - lv.at) / avg);
      if (lv.of && lap > lv.of) { lap = lv.of; }
      return L.sp.lap + ' ' + lap + (lv.of ? '/' + lv.of : '');
    }
    return '';
  }
  el = (now - g.t * 1000) / 60000;
  if (g.id.indexOf('manual:eebb') === 0) {       /* basketball: no live source, so a rough guess from the tip-off time */
    if (el < 0) { return ''; }
    if (el >= 54 && el < 69) { return '~' + L.sp.ht; }
    q = el < 27 ? 1 : (el < 54 ? 2 : (el < 95 ? 3 : 4));
    return '~' + L.sp.qn(q);
  }
  if (lv && lv.ph && lv.at && now - lv.at * 1000 < 20 * 60000) {     /* football, with a fresh clock from the job */
    am = Math.floor((now - lv.at * 1000) / 60000);
    ok = false;
    if (lv.ph === 'ht') { if (am < 16) { return L.sp.ht; } }
    else if (lv.ph === 'pen') { return L.sp.pen; }
    else if (lv.ph === '1' || lv.ph === '2' || lv.ph === 'et') {
      cap = lv.ph === '1' ? 45 : (lv.ph === '2' ? 90 : (lv.cap || 120));
      m = lv.m; x = lv.x || 0;
      if (x) { x += am; } else { m += am; if (m > cap) { x = m - cap; m = cap; } }
      ok = !(lv.ph === '1' && x > 8) && !(lv.ph === '2' && x > 12) && m > 0;
      if (ok) { return spMin(m, x); }
    }
  }
  if (el < 0) { return ''; }                                          /* football, guessed from the kick-off time */
  if (el <= 45) { return '~' + spMin(Math.max(1, Math.floor(el)), 0); }
  if (el <= 48) { return '~' + spMin(45, Math.floor(el) - 45); }
  if (el < 63) { return '~' + L.sp.ht; }
  m = 46 + Math.floor(el - 63);
  return '~' + (m <= 90 ? spMin(m, 0) : spMin(90, Math.min(m - 90, 9)));
}
function spLivePill(g, now, full) {
  var t = spLiveTxt(g, now);
  return '<span class="pill">' + esc(full ? (t ? L.sp.live + ' · ' + t : L.sp.liveNow) : (t ? t : L.sp.live)) + '</span>';
}
function spBall(kind, size) {
  var c = TH.muted;
  if (kind === 'ball') {
    return '<svg class="ti" width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="' + c + '" stroke-width="1.8"/>' +
           '<polygon points="12,7.4 16,10.3 14.5,15 9.5,15 8,10.3" fill="' + c + '"/></svg>';
  }
  return '<svg class="ti" width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="' + c + '" stroke-width="1.8"/>' +
         '<path d="M2.5 12h19M12 2.5v19M5.2 5.2c3.4 3.4 3.4 9.2 0 13.6M18.8 5.2c-3.4 3.4-3.4 9.2 0 13.6" fill="none" stroke="' + c + '" stroke-width="1.6"/></svg>';
}
function spTeamRow(key, now) {
  var lst = SPORTS.teams && SPORTS.teams[key], i, g, st;
  if (!lst) { return null; }
  for (i = 0; i < lst.length; i++) {
    g = lst[i];
    st = spState(g, now);
    if (st === 'done') { continue; }
    if (g.t * 1000 - now > SP_HORIZON_MS) { return null; }
    return { g: g, st: st };
  }
  return null;
}
function spTodayRows(now, skip, max) {
  var arr = [], i, g, st, gd, night, tk = spDayKey(now), nk = spDayKey(now + 86400000), hr = new Date(now).getHours(), list = SPORTS.games || [];
  for (i = 0; i < list.length; i++) {
    g = list[i];
    gd = spDayKey(g.t * 1000);
    /* from the evening on, tonight's NBA games (they start after midnight here) are listed already */
    night = g.c === 'NBA' && gd === nk && hr >= 20 && new Date(g.t * 1000).getHours() < 9;
    if ((gd !== tk && !night) || skip[g.id] || skip[g.t + '|' + g.m]) { continue; }
    st = spState(g, now);
    if (st === 'done') { continue; }
    arr.push({ g: g, st: st });
  }
  var total = arr.length;
  arr.sort(function (a, b) { return a.g.tier !== b.g.tier ? a.g.tier - b.g.tier : (a.g.t !== b.g.t ? a.g.t - b.g.t : (a.g.id < b.g.id ? -1 : 1)); });
  arr = arr.slice(0, max);
  arr.sort(function (a, b) { return a.g.t !== b.g.t ? a.g.t - b.g.t : (a.g.id < b.g.id ? -1 : 1); });
  return { rows: arr, more: total - arr.length };
}
function spWhen(g, now) {
  var k = spDayKey(g.t * 1000), day;
  if (k === spDayKey(now)) { day = L.sp.today; }
  else if (k === spDayKey(now + 86400000)) { day = L.sp.tomorrow; }
  else { day = spDate(g.t * 1000); }
  return g.tbc ? day + '<span class="mu"> · ' + L.sp.tbc + '</span>' : day + ' · ' + spHm(g.t * 1000);
}
/* one of your teams, as a row in the list (icon of the sport, short team tag, match, when) */
function spOwnHtml(key, kind, r, now) {
  var right = r.st === 'live' ? spLivePill(r.g, now, true) : '<span class="rt">' + spWhen(r.g, now) + '</span>';
  return '<div class="tr own"><span class="dtc">' + spBall(kind, 16) + '</span><span class="tg g1">' + L.sp.tags[key] + '</span><span class="tn">' +
         esc(r.g.m) + '</span>' + right + '</div>';
}
/* your teams as three cards, used only when there is nothing else on today */
function spCardHtml(key, kind, r, now) {
  var when = r.st === 'live' ? spLivePill(r.g, now, true) : spWhen(r.g, now);
  return '<div class="tm">' + spBall(kind, 22) + '<div class="tb"><div class="tml">' + esc(L.sp.teams[key]) + '</div><div class="tmm">' + esc(r.g.m) +
         '</div><div class="tmw">' + when + '</div></div></div>';
}
function spTodayHtml(r, now) {
  var g = r.g, t1 = g.tier === 1, right, name = g.m;
  if (g.k && L.sp.ses[g.k]) { name += ' · ' + L.sp.ses[g.k]; }
  if (g.allday) { right = '<span class="rt">' + L.sp.day(g.dn, g.dt) + '</span>'; }
  else if (r.st === 'live') { right = spLivePill(g, now, false); }
  else { right = '<span class="rt">' + spHm(g.t * 1000) + '</span>'; }
  return '<div class="tr' + (t1 ? '' : ' lo') + '"><span class="dtc"><span class="dot d' + g.tier + '"></span></span><span class="tg ' + (t1 ? 'g1' : 'g2') + '">' +
         esc(g.c) + '</span><span class="tn">' + esc(name) + '</span>' + right + '</div>';
}
/* One box: your teams first, then the games on today, flowing down the left column and on into the right one. */
function buildSports() {
  if (!SPORTS) { return ''; }
  var now = new Date().getTime(), i, rows = [], skip = {}, r, cap = land ? 14 : 4;
  for (i = 0; i < SP_TEAMS.length; i++) {
    r = spTeamRow(SP_TEAMS[i][0], now);
    if (r) { rows.push({ key: SP_TEAMS[i][0], kind: SP_TEAMS[i][1], r: r }); skip[r.g.id] = 1; skip[r.g.t + '|' + r.g.m] = 1; }
  }
  var tdy = spTodayRows(now, skip, Math.max(0, cap - rows.length));
  if (!rows.length && !tdy.rows.length) { return ''; }
  var cards = '', all = [], td = new Date(now), head, left;
  if (land && !tdy.rows.length) {
    for (i = 0; i < rows.length; i++) { cards += spCardHtml(rows[i].key, rows[i].kind, rows[i].r, now); }
    return '<div class="spw one"><div class="sh"><span class="spt">' + L.sp.ours + '</span><span class="spz">' + L.sp.tz + '</span></div><div class="tms">' + cards + '</div></div>';
  }
  for (i = 0; i < rows.length; i++) { all.push(spOwnHtml(rows[i].key, rows[i].kind, rows[i].r, now)); }
  for (i = 0; i < tdy.rows.length; i++) { all.push(spTodayHtml(tdy.rows[i], now)); }
  head = '<div class="sh"><span class="spt">' + L.sp.title + (tdy.rows.length ? ' · ' + L.today + ', ' + L.wdFull[td.getDay()] + ' ' + td.getDate() + (LANG === 'et' ? '. ' : ' ') + L.sp.mon[td.getMonth()] : '') +
         '</span><span class="spz">' + L.sp.tz + (tdy.more > 0 ? ' · ' + L.sp.more(tdy.more) : '') + '</span></div>';
  if (!land || all.length < 2) { return head + '<div class="scols"><div class="scol">' + all.join('') + '</div></div>'; }
  left = Math.ceil(all.length / 2);
  return head + '<div class="scols"><div class="scol">' + all.slice(0, left).join('') + '</div><div class="scol">' + all.slice(left).join('') + '</div></div>';
}
function setSportsOn(on) {
  if (on === spOn) { return; }
  spOn = on;
  var st = $('stage');
  st.className = (land ? 'land' : 'port') + (spOn ? ' sp' : '');
  if (M) { draw(); }
}
function drawSports() {
  try {
    var html = buildSports();
    if (html) { $('sports').innerHTML = html; }
    setSportsOn(!!html);
  } catch (e) { /* the sports panel must never disturb the weather page */ }
}
function spLoad() {
  var xhr = new XMLHttpRequest(), done = false;
  try {
    xhr.open('GET', 'sports.json?t=' + Math.floor(new Date().getTime() / 60000), true);
    xhr.timeout = 20000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4 || done) { return; }
      done = true;
      if (xhr.status === 200) {
        try { var d = JSON.parse(xhr.responseText); if (d && d.v === 1) { SPORTS = d; } } catch (e) { /* keep what we had */ }
      }
      drawSports();
    };
    xhr.send();
  } catch (e) { /* ignore */ }
}

/* ============ fitting the stage to the screen ============ */
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  var nowLand = w >= h;
  var sw = nowLand ? 1024 : 768, sh = nowLand ? 768 : 1024;
  var s = Math.min(w / sw, h / sh);
  var st = $('stage');
  st.className = (nowLand ? 'land' : 'port') + (spOn ? ' sp' : '');
  var tr = 'translate(' + ((w - sw * s) / 2).toFixed(2) + 'px,' + ((h - sh * s) / 2).toFixed(2) + 'px) scale(' + s.toFixed(4) + ')';
  st.style.webkitTransform = tr;
  st.style.transform = tr;
  if (nowLand !== land) { land = nowLand; if (M) { draw(); } drawSports(); }
}

/* ============ clock ============ */
function tick() {
  var n = new Date();
  var t = pad2(n.getHours()) + ':' + pad2(n.getMinutes());
  if (t !== lastHm) {
    lastHm = t;
    $('clock').textContent = t;
    $('date').textContent = dateLine(n);
    drawAlerts();
    drawSports();
  }
  refreshStatus();
}

/* ============ loading ============ */
var ATTEMPTS = [
  { models: MODEL_SETS[0], cur: true },
  { models: MODEL_SETS[0], cur: false },
  { models: MODEL_SETS[1], cur: false },
  { models: MODEL_SETS[2], cur: false },
  { models: [], cur: true }
];
function apiUrl(models, withCur) {
  var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON;
  if (withCur) {
    u += '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m';
  }
  u += '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m';
  u += '&daily=weather_code';
  u += '&timezone=auto&past_days=1&forecast_days=5&wind_speed_unit=ms';
  if (models.length) { u += '&models=' + models.join(','); }
  return u;
}
function schedule(ms) {
  if (timer) { clearTimeout(timer); }
  timer = setTimeout(load, ms);
}
function fail(msg) {
  errMsg = msg;
  refreshStatus();
  schedule(RETRY_MS);
}
function attempt(i) {
  var a = ATTEMPTS[i], xhr = new XMLHttpRequest(), done = false;
  function next(msg) { if (i + 1 < ATTEMPTS.length) { attempt(i + 1); } else { fail(msg); } }
  xhr.open('GET', apiUrl(a.models, a.cur), true);
  xhr.timeout = 25000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || done) { return; }
    done = true;
    if (xhr.status === 200) {
      var parsed = null;
      try { parsed = process(JSON.parse(xhr.responseText), a.models); }
      catch (e) { next(L.dataErr + ': ' + e.message); return; }
      M = parsed;
      startAtt = i;
      lastOk = new Date();
      errMsg = '';
      draw();
      schedule(REFRESH_MS);
    } else if (xhr.status === 400 || xhr.status === 422) {
      next(L.rejected + ' (' + xhr.status + ')');
    } else {
      /* no direct connection (an old browser that does not trust the weather server's certificate, or the server is down):
         use the copy that the GitHub job keeps next to this page */
      relayAttempt(L.noConn + (xhr.status ? ' (' + xhr.status + ')' : ''));
    }
  };
  xhr.send();
}
function relayAttempt(failMsg) {
  var xhr = new XMLHttpRequest(), done = false;
  xhr.open('GET', 'data.json?t=' + Math.floor(new Date().getTime() / 60000), true);
  xhr.timeout = 25000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || done) { return; }
    done = true;
    if (xhr.status === 200) {
      var parsed = null;
      try {
        var d = JSON.parse(xhr.responseText);
        if (!d._relay) { throw new Error('data.json'); }
        parsed = process(d, d._models || []);
      } catch (e) { fail(failMsg + ' · ' + L.dataErr + ': ' + e.message); return; }
      M = parsed;
      lastOk = new Date();
      errMsg = '';
      draw();
      schedule(REFRESH_MS);
    } else {
      fail(failMsg);
    }
  };
  xhr.send();
}
function load() { attempt(startAtt); }

document.body.onclick = function () { load(); spLoad(); };   // tap anywhere to refresh now
window.onresize = fit;
window.onorientationchange = function () { setTimeout(fit, 200); };
fit();
setInterval(tick, 5000);
tick();
load();
spLoad();
setInterval(spLoad, 3 * 60 * 1000);
setTimeout(function () { window.location.reload(); }, RELOAD_MS);   // fresh start every 6 hours

})();
</script>
