<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<title>Allikate test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font: 17px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 14px; background: #fff; color: #111; }
h1 { font-size: 24px; margin-bottom: 4px; }
p { margin: 6px 0; }
.t { border: 1px solid #bbb; border-radius: 8px; padding: 9px 11px; margin: 10px 0; }
.n { font-weight: bold; }
.ok { color: #0a7a2f; font-weight: bold; }
.no { color: #b00020; font-weight: bold; }
.wait { color: #777; }
pre { white-space: pre-wrap; word-wrap: break-word; font: 12px/1.3 Menlo, Courier, monospace; background: #f1f1f1; padding: 6px; margin-top: 6px; }
a { word-wrap: break-word; font-size: 13px; }
button { font-size: 18px; padding: 8px 16px; margin: 8px 0; }
</style>
</head>
<body>
<h1>Allikate test</h1>
<p>See leht proovib iga ilmaandmete allikat samamoodi, nagu ilmalehegi. Oota paar sekundit, tee ekraanist pilt ja saada see mulle. / This page tries each weather source the same way the weather page does. Wait a few seconds, photograph the screen and send it to me.</p>
<button id="again">Käivita uuesti / Run again</button>
<div id="out"></div>

<script>
(function () {
'use strict';
function qs(name, def) {
  var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : def;
}
var lat = parseFloat(qs('lat', '59.437')), lon = parseFloat(qs('lon', '24.754'));
if (isNaN(lat) || isNaN(lon)) { lat = 59.437; lon = 24.754; }
var vars = 'temperature_2m,precipitation,wind_gusts_10m';
var OM = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m&hourly=' + vars + '&timezone=auto&forecast_days=2&wind_speed_unit=ms&models=';

function keysWith(obj, prefix) {
  var out = [], k;
  for (k in obj) { if (obj.hasOwnProperty(k) && k.indexOf(prefix) === 0 && k.length > prefix.length) { out.push(k.slice(prefix.length)); } }
  return out;
}
function nonNull(a) { var i; if (!a || !a.length) { return false; } for (i = 0; i < a.length; i++) { if (a[i] !== null) { return true; } } return false; }

var yrData = null;   // filled in by test 3, used by the comparison table at the end

var TESTS = [
  { name: '1. Open-Meteo, 5 mudelit / 5 models (lehe põhipäring / the main request)',
    url: OM + 'ecmwf_ifs,icon_seamless,gfs_seamless,meteofrance_seamless,ukmo_seamless',
    sum: function (txt) {
      var d = JSON.parse(txt), res = [], k, names;
      if (d.error) { return 'API error: ' + d.reason; }
      names = keysWith(d.hourly, 'temperature_2m_');
      for (k = 0; k < names.length; k++) { res.push(names[k] + (nonNull(d.hourly['temperature_2m_' + names[k]]) ? ' OK' : ' (tühi/empty)')); }
      return 'mudelid / models: ' + res.join(', ') + '\ncurrent: ' + (d.current ? keysWith(d.current, 'temperature_2m_').join(', ') || 'plain' : 'puudub / missing');
    } },
  { name: '2. Open-Meteo, 3 mudelit / 3 models (varuvariant / fallback)',
    url: OM + 'ecmwf_ifs025,icon_seamless,gfs_seamless',
    sum: function (txt) {
      var d = JSON.parse(txt);
      if (d.error) { return 'API error: ' + d.reason; }
      return 'mudelid / models: ' + keysWith(d.hourly, 'temperature_2m_').join(', ');
    } },
  { name: '3. Yr.no / MET Norway',
    url: 'https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=' + lat.toFixed(4) + '&lon=' + lon.toFixed(4),
    sum: function (txt) {
      var d = JSON.parse(txt), ts = d.properties.timeseries;
      yrData = d;
      return 'uuendatud / updated: ' + d.properties.meta.updated_at + '\nridu / rows: ' + ts.length + '\nesimene / first: ' + ts[0].time + ', ' + ts[0].data.instant.details.air_temperature + ' C';
    } },
  { name: '4. ilmateenistus.ee: prognoos / forecast (XML)',
    url: 'https://ilmateenistus.ee/ilma_andmed/xml/forecast.php?lang=eng',
    sum: function (txt) { return 'pikkus / length: ' + txt.length + ' tähemärki\n' + txt.slice(0, 450); } },
  { name: '5. ilmateenistus.ee: vaatlused / observations (XML)',
    url: 'https://ilmateenistus.ee/ilma_andmed/xml/observations.php',
    sum: function (txt) {
      var names = [], re = /<name>([^<]*)<\/name>/g, m;
      while ((m = re.exec(txt)) !== null && names.length < 40) { names.push(m[1]); }
      return 'pikkus / length: ' + txt.length + '\njaamad / stations: ' + (names.join(', ') || '(ei leidnud <name> silte)') + '\n' + txt.slice(0, 300);
    } },
  { name: '6. ilmateenistus.ee: hoiatused / warnings (XML)',
    url: 'https://ilmateenistus.ee/ilma_andmed/xml/hoiatus.php',
    sum: function (txt) { return 'pikkus / length: ' + txt.length + '\n' + txt.slice(0, 450); } }
];

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
var out = document.getElementById('out');

function runOne(i, done) {
  var t = TESTS[i], box = document.createElement('div'), xhr = new XMLHttpRequest(), t0 = new Date().getTime(), finished = false;
  box.className = 't';
  box.innerHTML = '<div class="n">' + esc(t.name) + '</div><div class="wait">ootan / waiting…</div><div><a href="' + esc(t.url) + '">ava otse / open directly</a></div>';
  out.appendChild(box);
  function show(ok, line, body) {
    box.childNodes[1].className = ok ? 'ok' : 'no';
    box.childNodes[1].innerHTML = esc(line);
    if (body) { var pre = document.createElement('pre'); pre.textContent = body; box.insertBefore(pre, box.childNodes[2]); }
    done();
  }
  xhr.open('GET', t.url, true);
  xhr.timeout = 20000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || finished) { return; }
    finished = true;
    var ms = new Date().getTime() - t0, body;
    if (xhr.status === 200) {
      try { body = t.sum(xhr.responseText); show(true, 'OK · HTTP 200 · ' + ms + ' ms', body); }
      catch (e) { show(false, 'HTTP 200, kuid sisu ei sobi / but content not understood: ' + e.message, xhr.responseText.slice(0, 300)); }
    } else if (xhr.status === 0) {
      show(false, 'BLOKEERITUD / BLOCKED (status 0, ' + ms + ' ms): sertifikaat, CORS või ühendus / certificate, CORS or connection. Puuduta linki allpool: kui avaneb tekst, siis puudub ainult CORS luba. / Tap the link below: if text opens, only the CORS permission is missing.');
    } else {
      show(false, 'HTTP ' + xhr.status + ' (' + ms + ' ms)', xhr.responseText.slice(0, 300));
    }
  };
  xhr.send();
}
/* ---------- 7. model comparison at this location ---------- */
var CMP = [
  ['ecmwf_ifs', 'ECMWF 9km'], ['icon_seamless', 'ICON (DWD)'], ['gfs_seamless', 'GFS (USA)'],
  ['meteofrance_seamless', 'ARPEGE (FR)'], ['ukmo_seamless', 'UKMO (UK)'], ['gem_seamless', 'GEM (CA)'],
  ['metno_nordic', 'MET Nordic'], ['dmi_harmonie_arome_europe', 'HARMONIE DMI']
];
var OFFS = [0, 3, 6, 12, 24];
function pad(s, n) { s = String(s); while (s.length < n) { s += ' '; } return s; }
function lpad(s, n) { s = String(s); while (s.length < n) { s = ' ' + s; } return s; }
function f1(v) { return (v === null || v === undefined || isNaN(v)) ? '-' : (Math.round(v * 10) / 10).toFixed(1); }
function getJson(url, cb) {
  var x = new XMLHttpRequest(), fin = false;
  x.open('GET', url, true);
  x.timeout = 20000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || fin) { return; }
    fin = true;
    var obj = null;
    if (x.status === 200) { try { obj = JSON.parse(x.responseText); } catch (e) { obj = null; } }
    cb(x.status, obj, x.responseText || '');
  };
  x.send();
}
function rowLine(name, temps, psum, wind) {
  var s = pad(name, 13), i;
  for (i = 0; i < temps.length; i++) { s += lpad(f1(temps[i]), 6); }
  return s + lpad(f1(psum), 7) + lpad(f1(wind), 5);
}
function median(a) {
  var b = [], i;
  for (i = 0; i < a.length; i++) { if (a[i] !== null && a[i] !== undefined && !isNaN(a[i])) { b.push(a[i]); } }
  if (!b.length) { return null; }
  b.sort(function (x, y) { return x - y; });
  return b.length % 2 ? b[(b.length - 1) / 2] : (b[b.length / 2 - 1] + b[b.length / 2]) / 2;
}
function omRow(d, T0) {
  var h = d.hourly, tm = h.time, i, j, temps = [], idx = {}, ps = 0, pc = 0, w = null;
  for (i = 0; i < tm.length; i++) { idx[tm[i]] = i; }
  for (j = 0; j < OFFS.length; j++) {
    i = idx[T0 + OFFS[j] * 3600];
    temps.push(i === undefined ? null : h.temperature_2m[i]);
  }
  for (i = 0; i < tm.length; i++) {
    if (tm[i] > T0 && tm[i] <= T0 + 86400 && h.precipitation[i] !== null) { ps += h.precipitation[i]; pc++; }
  }
  i = idx[T0];
  if (i !== undefined) { w = h.wind_speed_10m[i]; }
  var any = false;
  for (j = 0; j < temps.length; j++) { if (temps[j] !== null) { any = true; } }
  return { ok: any, temps: temps, psum: pc ? ps : null, wind: w };
}
function yrRow(d, T0) {
  var ts = d.properties.timeseries, by = {}, i, j, e, t, temps = [], ps = 0, pc = 0, w = null;
  for (i = 0; i < ts.length; i++) {
    e = ts[i];
    t = Math.floor(Date.parse(e.time) / 1000);
    by[t] = e;
    if (t >= T0 && t < T0 + 86400 && e.data.next_1_hours && e.data.next_1_hours.details) {
      ps += e.data.next_1_hours.details.precipitation_amount; pc++;
    }
  }
  for (j = 0; j < OFFS.length; j++) {
    e = by[T0 + OFFS[j] * 3600];
    temps.push(e ? e.data.instant.details.air_temperature : null);
  }
  e = by[T0];
  if (e) { w = e.data.instant.details.wind_speed; }
  return { ok: true, temps: temps, psum: pc ? ps : null, wind: w };
}
function runCompare(done) {
  var box = document.createElement('div'), T0 = Math.floor(new Date().getTime() / 3600000) * 3600, k = 0, rows = [], notes = [], i;
  box.className = 't';
  box.innerHTML = '<div class="n">7. Mudelite võrdlus sinu asukohas / Model comparison at your location</div><div class="wait">ootan / waiting…</div>';
  out.appendChild(box);
  function finish() {
    var head = pad('mudel/model', 13), j, lines = [], medT = [], col, vals, pm = [], wm = [];
    for (j = 0; j < OFFS.length; j++) { head += lpad(OFFS[j] ? '+' + OFFS[j] + 'h' : 'nüüd', 6); }
    head += lpad('mm 24h', 7) + lpad('m/s', 5);
    lines.push(head);
    for (j = 0; j < rows.length; j++) { if (rows[j].res && rows[j].res.ok) { lines.push(rowLine(rows[j].name, rows[j].res.temps, rows[j].res.psum, rows[j].res.wind)); } }
    for (col = 0; col < OFFS.length; col++) {
      vals = [];
      for (j = 0; j < rows.length; j++) { if (rows[j].res && rows[j].res.ok && rows[j].name !== 'Yr.no (MET)') { vals.push(rows[j].res.temps[col]); } }
      medT.push(median(vals));
    }
    for (j = 0; j < rows.length; j++) {
      if (rows[j].res && rows[j].res.ok && rows[j].name !== 'Yr.no (MET)') { pm.push(rows[j].res.psum); wm.push(rows[j].res.wind); }
    }
    lines.push(rowLine('mediaan/median', medT, median(pm), median(wm)));
    for (j = 0; j < rows.length; j++) { if (!(rows[j].res && rows[j].res.ok)) { notes.push(rows[j].name + ': ' + rows[j].why); } }
    box.childNodes[1].className = 'ok';
    box.childNodes[1].textContent = 'Valmis / Done';
    var pre = document.createElement('pre');
    pre.style.fontSize = '10.5px';
    pre.textContent = lines.join('\n') + (notes.length ? '\n\nEi andmeid / No data:\n' + notes.join('\n') : '') +
      '\n\nYr.no = MET Norway otse; ilmateenistus.ee kasutab ECMWF 9 km (= esimene rida). / Yr.no = MET Norway directly; ilmateenistus.ee uses ECMWF 9 km (= first row).';
    box.appendChild(pre);
    done();
  }
  function step() {
    if (k >= CMP.length) {
      if (yrData) {
        try { rows.push({ name: 'Yr.no (MET)', res: yrRow(yrData, T0) }); }
        catch (e) { rows.push({ name: 'Yr.no (MET)', res: null, why: 'ei saa lugeda / unreadable' }); }
      } else {
        rows.push({ name: 'Yr.no (MET)', res: null, why: 'test 3 ebaõnnestus / test 3 failed' });
      }
      finish();
      return;
    }
    var m = CMP[k];
    k++;
    getJson('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&hourly=temperature_2m,precipitation,wind_speed_10m&timezone=GMT&timeformat=unixtime&forecast_hours=26&wind_speed_unit=ms&models=' + m[0],
      function (status, d, raw) {
        var r = null;
        if (status === 200 && d && d.hourly) {
          try { r = omRow(d, T0); } catch (e) { r = null; }
          rows.push(r && r.ok ? { name: m[1], res: r } : { name: m[1], res: null, why: 'kõik tühjad (ei kata?) / all empty (no coverage?)' });
        } else if (status === 0) {
          rows.push({ name: m[1], res: null, why: 'blokeeritud / blocked' });
        } else {
          rows.push({ name: m[1], res: null, why: 'HTTP ' + status + ' ' + (raw ? raw.slice(0, 60) : '') });
        }
        step();
      });
  }
  step();
}

function runAll() {
  var i = 0;
  out.innerHTML = '';
  function next() {
    if (i < TESTS.length) { var k = i; i++; runOne(k, next); }
    else { runCompare(function () {}); }
  }
  next();
}
document.getElementById('again').onclick = runAll;
runAll();
})();
</script>
</body>
</html>
